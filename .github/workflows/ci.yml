name: Frontend CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://leerraum.ch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check formatting
        run: pnpm --dir frontend format:check

      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm --dir frontend typecheck 2>&1 | tee /tmp/typecheck-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/typecheck-output.txt frontend/typecheck-output.txt
            git add frontend/typecheck-output.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: capture Goya typecheck diagnostic"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
          exit "$status"

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Run unit tests
        run: pnpm --dir frontend test

      - name: Run accessibility contract tests
        run: pnpm --dir frontend test:a11y

      - name: Run performance budget tests
        run: pnpm --dir frontend test:performance

      - name: Build production application
        run: pnpm --dir frontend build
