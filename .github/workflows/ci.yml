name: Frontend CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://leerraum.ch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set +e
          pnpm --dir frontend install --no-frozen-lockfile > frontend/install.log 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "Dependency installation failed; raw output is attached as a workflow artifact."
          fi
          exit "$status"

      - name: Upload dependency installation log
        if: failure() && steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-install-log
          path: frontend/install.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload generated lockfile
        if: steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-pnpm-lock
          path: frontend/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3

      - name: Check formatting
        id: format
        shell: bash
        run: |
          set +e
          pnpm --dir frontend format:check > frontend/format.log 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            pnpm --dir frontend format > /dev/null 2>&1
            git diff -- . ':(exclude)frontend/pnpm-lock.yaml' > frontend/format.patch
            echo "Formatting failed; the formatter output and exact patch are attached."
          fi
          exit "$status"

      - name: Upload formatting diagnostics
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-format-diagnostics
          path: |
            frontend/format.log
            frontend/format.patch
          if-no-files-found: error
          retention-days: 3

      - name: Typecheck
        run: pnpm --dir frontend typecheck

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Run unit tests
        run: pnpm --dir frontend test

      - name: Run accessibility contract tests
        run: pnpm --dir frontend test:a11y

      - name: Run performance budget tests
        run: pnpm --dir frontend test:performance

      - name: Build production application
        run: pnpm --dir frontend build
