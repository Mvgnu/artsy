name: Frontend CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://leerraum.ch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set +e
          pnpm --dir frontend install --no-frozen-lockfile > frontend/install.log 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "Dependency installation failed; raw output is attached as a workflow artifact."
          fi
          exit "$status"

      - name: Upload dependency installation log
        if: failure() && steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-install-log
          path: frontend/install.log
          if-no-files-found: error
          retention-days: 3

      - name: Normalize scaffold and lock dependencies
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/scaffold-nextjs-foundation'
        shell: bash
        run: |
          pnpm --dir frontend format
          git add frontend
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize frontend scaffold"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Check formatting
        run: pnpm --dir frontend format:check

      - name: Typecheck
        run: pnpm --dir frontend typecheck

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Run unit tests
        run: pnpm --dir frontend test

      - name: Run accessibility contract tests
        run: pnpm --dir frontend test:a11y

      - name: Run performance budget tests
        run: pnpm --dir frontend test:performance

      - name: Build production application
        run: pnpm --dir frontend build
